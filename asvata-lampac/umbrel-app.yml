releaseNotes: >-
  Lampac NextGen 1.83.1, ревизия пакета 2.


  Новый сервис cache-cleaner чистит дисковый кэш TorrServer: раз в час удаляет раздачи,
  в которые ничего не докачивалось 7 дней, а если на диске свободно меньше 50 ГБ —
  самые старые, пока место не освободится. Кэш лежит на системном диске umbrelOS, и без
  очистки он рос бы бесконечно.


  Сам дисковый кэш включается в настройках TorrServer, см. README магазина, раздел
  «Дисковый кэш TorrServer». Без него сервис просто ничего не делает.
