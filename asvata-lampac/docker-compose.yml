version: "3.7"

x-lampac-image: &lampac-image
  ghcr.io/lampac-nextgen/lampac:1.52.0@sha256:8d7b487f77c3a0099eeec9b78f5b5c77aa64843220fa9786dac7f581cf966afb

services:

  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1
      APP_HOST: asvata-lampac_server_1
      APP_PORT: 9118
      # Lampa-клиенты (Android TV, Tizen, webOS) ходят в Lampac напрямую по HTTP
      # и не умеют проходить авторизацию umbrelOS, поэтому прокси-аутентификация
      # отключена. Доступ ограничивайте средствами самого Lampac (accsdb / WAF в init.conf).
      PROXY_AUTH_ADD: "false"

  # Одноразовый init: создаёт структуру каталогов в APP_DATA_DIR, кладёт стартовый
  # init.conf и генерирует случайный root-пароль, если их ещё нет.
  # Нужен потому, что init.conf и passwd лежат в корне рабочего каталога /lampac
  # и монтируются пофайлово — файлы должны существовать на хосте до старта сервера.
  #
  # Стартовый init.conf НЕ копируется из example.init.conf образа: там в
  # BaseModule.SkipModules выключены JacRed, TorrServer, Sync и TimeCode, из-за чего
  # маршрут /api/v2.0/indexers/*/results отдаёт 404 и Lampa пишет «Парсер не отвечает».
  # Массивы в init.conf ЗАМЕНЯЮТ значения из base.conf, а не дополняют их, поэтому
  # SkipModules перечислен целиком.
  #
  # JacRed.disableJackett по умолчанию true (модуль рассчитан на typesearch=webapi).
  # При этом поиск по трекерам работает, а вот /<трекер>/parsemagnet отдаёт текст
  # "disable" — TorrServer получает его вместо торрента и Lampa пишет
  # «Не удалось получить HASH». Для typesearch=jackett флаг обязан быть false.
  init:
    image: *lampac-image
    user: "0:0"
    restart: on-failure
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mkdir -p /data/config /data/cache /data/database /data/plugins /data/mods /data/torrserver
        if [ ! -f /data/config/init.conf ]; then
        cat > /data/config/init.conf <<'CONF'
        {
          "listen": {
            "ip": "0.0.0.0",
            "port": 9118,
            "scheme": "http"
          },
          "BaseModule": {
            "SkipModules": [
              "CacheMedia",
              "Catalog",
              "DLNA",
              "ForkPlayerXML",
              "MsxNative",
              "Potok",
              "TelegramAuth",
              "TelegramAuthBot",
              "Tracks",
              "Transcoding",
              "WebLog"
            ]
          },
          "chromium": {
            "enable": true,
            "executablePath": "/usr/bin/chromium"
          },
          "JacRed": {
            "typesearch": "jackett",
            "disableJackett": false
          },
          "online": {
            "name": "Lampac",
            "spiderName": "Lampac"
          }
        }
        CONF
        fi
        [ -f /data/config/passwd ] || tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > /data/config/passwd
        chown 1000:1000 /data /data/config /data/cache /data/database /data/plugins /data/mods /data/torrserver
        chown 1000:1000 /data/config/init.conf /data/config/passwd
        chmod 600 /data/config/passwd
        echo "lampac init: ok"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: *lampac-image
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 1m
    # Chromium/Playwright требует больше /dev/shm, чем 64 МБ по умолчанию
    shm_size: 1024mb
    # init.conf и passwd подключены симлинками, а не bind-mount отдельных файлов.
    # Bind-mount файла привязывается к inode: любой редактор с атомарным сохранением
    # (sed -i, vim, VS Code) создаёт новый файл и подменяет inode — контейнер после
    # этого навсегда читает старую версию, пока его не пересоздадут. Симлинк на файл
    # внутри примонтированного КАТАЛОГА /data разрешается при каждом чтении, поэтому
    # правки подхватываются любым способом, и hot-reload конфига продолжает работать.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ln -sf /data/config/init.conf /lampac/init.conf
        ln -sf /data/config/passwd /lampac/passwd
        exec /usr/share/dotnet/dotnet Core.dll
    volumes:
      # Конфиг и root-пароль (цели симлинков выше)
      - ${APP_DATA_DIR}/data:/data
      # Постоянные данные
      - ${APP_DATA_DIR}/data/cache:/lampac/cache
      - ${APP_DATA_DIR}/data/database:/lampac/database
      # Бинарник TorrServer, его accs.db/settings.json и список «Мои торренты».
      # Монтируется только подкаталог: в /lampac/data лежат ffmpeg и ffprobe из образа.
      - ${APP_DATA_DIR}/data/torrserver:/lampac/data/ts
      # Пользовательские плагины и модули
      - ${APP_DATA_DIR}/data/plugins:/lampac/plugins/override
      - ${APP_DATA_DIR}/data/mods:/lampac/mods
