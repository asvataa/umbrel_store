version: "3.7"

x-lampac-image: &lampac-image
  ghcr.io/lampac-nextgen/lampac:1.83.1@sha256:ff46ce1a49cb3c11f4dbd2d9dd0d410a0bf52de3a2884db3be91de90cc84e056

services:

  app_proxy:
    environment:
      # <app-id>_<docker-service-name>_1
      APP_HOST: asvata-lampac_server_1
      APP_PORT: 9118
      # Lampa-клиенты (Android TV, Tizen, webOS) ходят в Lampac напрямую по HTTP
      # и не умеют проходить авторизацию umbrelOS, поэтому прокси-аутентификация
      # отключена. Доступ ограничивайте средствами самого Lampac (accsdb / WAF в init.conf).
      PROXY_AUTH_ADD: "false"

  # Одноразовый init: создаёт структуру каталогов в APP_DATA_DIR, кладёт стартовый
  # init.conf и генерирует случайный root-пароль, если их ещё нет.
  # Нужен потому, что init.conf и passwd лежат в корне рабочего каталога /lampac
  # и монтируются пофайлово — файлы должны существовать на хосте до старта сервера.
  #
  # Стартовый init.conf НЕ копируется из example.init.conf образа: там в
  # BaseModule.SkipModules выключены JacRed, TorrServer, Sync и TimeCode, из-за чего
  # маршрут /api/v2.0/indexers/*/results отдаёт 404 и Lampa пишет «Парсер не отвечает».
  # Массивы в init.conf ЗАМЕНЯЮТ значения из base.conf, а не дополняют их, поэтому
  # SkipModules перечислен целиком.
  #
  # JacRed.disableJackett по умолчанию true (модуль рассчитан на typesearch=webapi).
  # При этом поиск по трекерам работает, а вот /<трекер>/parsemagnet отдаёт текст
  # "disable" — TorrServer получает его вместо торрента и Lampa пишет
  # «Не удалось получить HASH». Для typesearch=jackett флаг обязан быть false.
  init:
    image: *lampac-image
    user: "0:0"
    restart: on-failure
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mkdir -p /data/config /data/cache /data/database /data/plugins /data/mods /data/torrserver
        if [ ! -f /data/config/init.conf ]; then
        cat > /data/config/init.conf <<'CONF'
        {
          "listen": {
            "ip": "0.0.0.0",
            "port": 9118,
            "scheme": "http"
          },
          "BaseModule": {
            "SkipModules": [
              "CacheMedia",
              "Catalog",
              "DLNA",
              "ForkPlayerXML",
              "MsxNative",
              "Potok",
              "TelegramAuth",
              "TelegramAuthBot",
              "Tracks",
              "Transcoding",
              "WebLog"
            ]
          },
          "chromium": {
            "enable": true,
            "executablePath": "/usr/bin/chromium"
          },
          "JacRed": {
            "typesearch": "jackett",
            "disableJackett": false
          },
          "online": {
            "name": "Lampac",
            "spiderName": "Lampac"
          }
        }
        CONF
        fi
        [ -f /data/config/passwd ] || tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32 > /data/config/passwd
        chown 1000:1000 /data /data/config /data/cache /data/database /data/plugins /data/mods /data/torrserver
        chown 1000:1000 /data/config/init.conf /data/config/passwd
        chmod 600 /data/config/passwd
        echo "lampac init: ok"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: *lampac-image
    depends_on:
      init:
        condition: service_completed_successfully
    restart: on-failure
    stop_grace_period: 1m
    # Chromium/Playwright требует больше /dev/shm, чем 64 МБ по умолчанию
    shm_size: 1024mb
    # TorrServer работает подпроцессом внутри ЭТОГО же контейнера и сам ходит по
    # ссылкам вида http://umbrel.local:9118/<трекер>/parsemagnet — Lampac строит их
    # из заголовка Host запроса. Имя umbrel.local живёт только в mDNS, а в debian-slim
    # нет ни avahi, ни nss-mdns, и Docker mDNS в резолвер контейнера не пробрасывает,
    # поэтому такая ссылка не открывается и Lampa пишет «Не удалось получить HASH».
    # Заворачиваем имя на сам контейнер: Lampac слушает 9118 на 0.0.0.0, включая loopback.
    # Если устройство переименовано и его имя не umbrel.local — поправьте строку ниже
    # или задайте listen.host в init.conf (см. README).
    extra_hosts:
      - "umbrel.local:127.0.0.1"
    # init.conf и passwd подключены симлинками, а не bind-mount отдельных файлов.
    # Bind-mount файла привязывается к inode: любой редактор с атомарным сохранением
    # (sed -i, vim, VS Code) создаёт новый файл и подменяет inode — контейнер после
    # этого навсегда читает старую версию, пока его не пересоздадут. Симлинк на файл
    # внутри примонтированного КАТАЛОГА /data разрешается при каждом чтении, поэтому
    # правки подхватываются любым способом, и hot-reload конфига продолжает работать.
    entrypoint:
      - /bin/sh
      - -c
      - |
        ln -sf /data/config/init.conf /lampac/init.conf
        ln -sf /data/config/passwd /lampac/passwd
        exec /usr/share/dotnet/dotnet Core.dll
    volumes:
      # Конфиг и root-пароль (цели симлинков выше)
      - ${APP_DATA_DIR}/data:/data
      # Постоянные данные
      - ${APP_DATA_DIR}/data/cache:/lampac/cache
      - ${APP_DATA_DIR}/data/database:/lampac/database
      # Бинарник TorrServer, его accs.db/settings.json и список «Мои торренты».
      # Монтируется только подкаталог: в /lampac/data лежат ffmpeg и ffprobe из образа.
      - ${APP_DATA_DIR}/data/torrserver:/lampac/data/ts
      # Пользовательские плагины и модули
      - ${APP_DATA_DIR}/data/plugins:/lampac/plugins/override
      - ${APP_DATA_DIR}/data/mods:/lampac/mods

  # Очистка дискового кэша TorrServer (UseDisk, TorrentsSavePath=/lampac/data/ts/cache).
  # TorrServer сам по времени ничего не удаляет: RemoveCacheOnDrop стирает кэш сразу
  # при выгрузке раздачи, а без него куски лежат вечно. Таймер на хосте не подходит —
  # корень umbrelOS это overlay Rugix, и /etc сбрасывается при обновлении ОС.
  #
  # Раз в час:
  #   1. удаляет раздачи, в которые ничего не докачивалось KEEP_DAYS дней
  #      (mtime куска меняется только при записи, чтение из кэша его не обновляет);
  #   2. если на диске меньше MIN_FREE_GB — удаляет самые старые раздачи, пока
  #      место не освободится: кэш лежит на системном диске umbrelOS.
  # Удаление через find -delete внутри /ts/cache, без rm -rf: пустая переменная не
  # сможет превратиться в удаление чего-то за пределами кэша.
  # $$ — экранирование для docker compose, иначе он подставит переменные сам.
  cache-cleaner:
    image: *lampac-image
    depends_on:
      init:
        condition: service_completed_successfully
    user: "1000:1000"
    restart: on-failure
    environment:
      KEEP_DAYS: "7"
      MIN_FREE_GB: "50"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "cache-cleaner: KEEP_DAYS=$$KEEP_DAYS MIN_FREE_GB=$$MIN_FREE_GB"
        while true; do
          if [ -d /ts/cache ]; then
            for d in /ts/cache/*/; do
              [ -d "$$d" ] || continue
              [ -n "$$(find "$$d" -type f -mtime -"$$KEEP_DAYS" -print -quit)" ] && continue
              echo "cache-cleaner: $$(basename "$$d") не докачивалась $$KEEP_DAYS дн., удаляю"
              find /ts/cache -mindepth 1 -maxdepth 1 -type d -name "$$(basename "$$d")" -exec find {} -delete \;
            done
            while [ "$$(df -Pk /ts/cache | awk 'NR==2{print int($$4/1048576)}')" -lt "$$MIN_FREE_GB" ]; do
              oldest=$$(for d in /ts/cache/*/; do
                [ -d "$$d" ] && printf '%s %s\n' "$$(find "$$d" -type f -printf '%T@\n' | sort -n | tail -1)" "$$(basename "$$d")"
              done | sort -n | head -1 | cut -d' ' -f2)
              [ -n "$$oldest" ] || break
              echo "cache-cleaner: свободно меньше $$MIN_FREE_GB ГБ, удаляю $$oldest"
              find /ts/cache -mindepth 1 -maxdepth 1 -type d -name "$$oldest" -exec find {} -delete \;
            done
          fi
          sleep 3600
        done
    volumes:
      - ${APP_DATA_DIR}/data/torrserver:/ts
